server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://127.0.0.1:8081/realms/commerce}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/orders/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8083}
              predicates:
                - Path=/api/v1/inventory/**
            - id: product-catalog
              uri: ${PRODUCT_CATALOG_URL:http://127.0.0.1:8084}
              predicates:
                - Path=/api/v1/products/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8085}
              predicates:
                - Path=/api/v1/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  file.name: ${LOG_FILE:../logs/api-gateway.log}
