server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://127.0.0.1:8081/realms/commerce}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8082}
              predicates:
                - Path=/api/v1/orders/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8083}
              predicates:
                - Path=/api/v1/inventory/**
            - id: product-catalog
              uri: ${PRODUCT_CATALOG_URL:http://127.0.0.1:8084}
              predicates:
                - Path=/api/v1/products/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8085}
              predicates:
                - Path=/api/v1/payments/**
            - id: order-service-openapi
              uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8082}
              predicates:
                - Path=/api-docs/orders/**
              filters:
                - StripPrefix=2
            - id: inventory-service-openapi
              uri: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8083}
              predicates:
                - Path=/api-docs/inventory/**
              filters:
                - StripPrefix=2
            - id: product-catalog-openapi
              uri: ${PRODUCT_CATALOG_URL:http://127.0.0.1:8084}
              predicates:
                - Path=/api-docs/products/**
              filters:
                - StripPrefix=2
            - id: payment-service-openapi
              uri: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8085}
              predicates:
                - Path=/api-docs/payments/**
              filters:
                - StripPrefix=2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Order Service
        url: /api-docs/orders/v3/api-docs
      - name: Inventory Service
        url: /api-docs/inventory/v3/api-docs
      - name: Product Catalog
        url: /api-docs/products/v3/api-docs
      - name: Payment Service
        url: /api-docs/payments/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  file.name: ${LOG_FILE:../logs/api-gateway.log}
