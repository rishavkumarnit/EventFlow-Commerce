server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_BASE_URL:http://127.0.0.1:8081}/realms/commerce
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: http://${ORDER_SERVICE_HOSTPORT:127.0.0.1:8082}
              predicates:
                - Path=/api/v1/orders/**
            - id: inventory-service
              uri: http://${INVENTORY_SERVICE_HOSTPORT:127.0.0.1:8083}
              predicates:
                - Path=/api/v1/inventory/**
            - id: product-catalog
              uri: http://${PRODUCT_CATALOG_SERVICE_HOSTPORT:127.0.0.1:8084}
              predicates:
                - Path=/api/v1/products/**
            - id: payment-service
              uri: http://${PAYMENT_SERVICE_HOSTPORT:127.0.0.1:8085}
              predicates:
                - Path=/api/v1/payments/**
            - id: order-service-openapi
              uri: http://${ORDER_SERVICE_HOSTPORT:127.0.0.1:8082}
              predicates:
                - Path=/api-docs/orders/**
              filters:
                - StripPrefix=2
            - id: inventory-service-openapi
              uri: http://${INVENTORY_SERVICE_HOSTPORT:127.0.0.1:8083}
              predicates:
                - Path=/api-docs/inventory/**
              filters:
                - StripPrefix=2
            - id: product-catalog-openapi
              uri: http://${PRODUCT_CATALOG_SERVICE_HOSTPORT:127.0.0.1:8084}
              predicates:
                - Path=/api-docs/products/**
              filters:
                - StripPrefix=2
            - id: payment-service-openapi
              uri: http://${PAYMENT_SERVICE_HOSTPORT:127.0.0.1:8085}
              predicates:
                - Path=/api-docs/payments/**
              filters:
                - StripPrefix=2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Order Service
        url: /api-docs/orders/v3/api-docs
      - name: Inventory Service
        url: /api-docs/inventory/v3/api-docs
      - name: Product Catalog
        url: /api-docs/products/v3/api-docs
      - name: Payment Service
        url: /api-docs/payments/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  throttle:
    # Per client IP, per 60-second window. Override with THROTTLE_REQUESTS_PER_MINUTE in deployment.
    requests-per-minute: ${THROTTLE_REQUESTS_PER_MINUTE:60}
logging:
  file.name: ${LOG_FILE:../logs/api-gateway.log}
