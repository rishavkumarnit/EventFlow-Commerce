server: { port: 8084 }
spring:
 application: { name: product-catalog }
 datasource:
  url: ${PRODUCT_DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/product_db}
  username: ${PRODUCT_DATABASE_USER:commerce}
  password: ${PRODUCT_DATABASE_PASSWORD:commerce}
 jpa: { hibernate: { ddl-auto: validate } }
 flyway: { enabled: true }
management: { endpoints: { web: { exposure: { include: health,info,metrics,prometheus } } } }
