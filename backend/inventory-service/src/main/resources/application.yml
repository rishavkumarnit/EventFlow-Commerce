spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      group-id: inventory-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.rishav.commerce.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: ${INVENTORY_DATABASE_URL:jdbc:postgresql://${INVENTORY_DATABASE_HOST:127.0.0.1}:${INVENTORY_DATABASE_PORT:5433}/${INVENTORY_DATABASE_NAME:inventory_db}}
    username: ${INVENTORY_DATABASE_USER:commerce}
    password: ${INVENTORY_DATABASE_PASSWORD:commerce}
  jpa:
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
logging:
  file.name: ${LOG_FILE:../logs/inventory-service.log}
server:
  port: ${PORT:8083}
